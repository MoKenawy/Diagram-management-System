openapi: 3.0.0
info:
  title: Backend API Documentation
  version: 1.0.0
  description: API documentation for Auth and User management

servers:
  - url: http://localhost:80  # Use the URL you type in the browser
    description: Production/Staging Server
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        fullName: { type: string }
        role: { type: string }
        departmentId: { type: string }

paths:
  /api/auth/login:
    post:
      summary: Login to get access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        200:
          description: Login successful. Sets refreshToken in HTTP-only cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        400:
          description: Validation error (Zod)
        401:
          description: Invalid credentials
        423:
          description: Account locked

  /api/auth/logout:
    post:
      summary: Logout and clear session
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logged out successfully
        401:
          description: Unauthorized

  /api/auth/refresh:
    post:
      summary: Refresh access token using cookie
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        200:
          description: New access token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        401:
          description: Session expired or invalid

  /api/auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'